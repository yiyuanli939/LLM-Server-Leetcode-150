milestones:
  M1: 分词、采样、流式输出：单请求生成
  M2: 服务器：连续 batching、准入、多 worker、传输、离线批任务规划
  M3: KV Cache 块管理器：分页分配、空闲表、淘汰策略、快照与泄漏检测
  M4: 前缀缓存与 deadline 索引：Trie、BST 索引、持久化
  M5: 模型 IR 与配置：计算图编译执行、配置解析
  M6: 解码与评测：投机解码草稿树、评测指标、benchmark 与 fuzz
  M7: 可观测性与自动扩缩容：指标面板、容量规划
