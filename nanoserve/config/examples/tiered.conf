/* Tiered deployment using the M3 KV-cache manager and the M4 prefix cache / deadline queue.
   (Loading works on its own; running it needs the M3/M4 plug-ins.) */
[flags]
latency_slo = on
share_sys   = t
[server]
max_batch    = 4 * 2
policy       = edf
kv_blocks    = 1024 / 8 - 2 * 4        // = 120 blocks
block_size   = 8
eviction     = lfu
prefix_cache = &(share_sys, latency_slo)
token_budget = none
[model]
path = /srv/weights/./staging/../toy/ngram-5/   // "//" would start a comment: single slashes only
[workers]
pool = 3[2[hbm,]ddr,]                // = hbm,hbm,ddr x 3
[pool.ddr]
kv_blocks = 60
[routes]
toy-??b-*  = 3
toy-*      = 0
