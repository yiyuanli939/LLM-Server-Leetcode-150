/* nano-serve example deployment: three workers, model-name routing, feature flags.
   Load it with   python -m nanoserve config nanoserve/config/examples/server.conf
   Everything here runs on the M2 server core (FCFS, no KV accounting, no prefix cache). */

[flags]
stable   = t
debug    = off
canary   = &(stable, !(debug))        // flags may use other flags, in any order
fast     = |(canary, debug)
paranoid = !(|(stable, canary))

[server]
max_batch     = 2 * 2                 // * and / (no parentheses)
prefill_chunk = 64 / 4 - 8            // = 8
token_budget  = 4096 - (512 + 128)    // + - and parentheses, unary minus allowed: = 3456
policy        = fcfs
kv_blocks     = none
prefix_cache  = &(paranoid, fast)     // = f: a bool is a flag condition
max_sessions  = none
session_ttl   = -(-50)                // = 50
max_ticks     = 20000

[model]
path     = /models/./toy/../toy/ngram-5/   // normalised to /models/toy/ngram-5
compiled = fast                            // run the model through the M5 IR compiler

[workers]
pool = 2[gpu-a,]cpu_b                 // template: = gpu-a, gpu-a, cpu_b

[pool.cpu_b]                          // overrides for every worker of kind cpu_b
max_batch     = 1
prefill_chunk = 4

[routes]                              // first matching glob wins; worker = index into the pool
toy-*-instruct = 1
toy-chat*      = 0
Toy?Base       = 2
*              = 0
